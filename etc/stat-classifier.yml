# StatClassifier#type checks pass/fail/skip in this file's top-level
# key order and returns the first type whose pattern matches. dmesg/last_state
# below have both a specific pass word and a blanket `fail: .+` entry for the
# same prefix, so pass is intentionally listed before fail -- reordering
# these three top-level keys would silently flip dmesg.boot_succeeded/
# last_state.completed from pass to fail. See the "real
# etc/stat-classifier.yml" spec in stat_classifier_spec.rb.
pass:
  '*': pass
  rcuperf: completed
  last_state: completed
  dmesg: boot_succeeded

fail:
  '*': fail[^_]* error[^_]* timeout job_oom job_soft_timeout killed_by.* warn[^_]*
  stderr: .+
  kselftests: xfailed xfail
  dmesg: .+
  kmemleak: unreferenced_object\..+
  kmsg: .+
  last_state: .+
  rcutorture: rcu_hotplug
  locktorture: lock_hotplug
  leaking-addresses: dmesg\.(?!R).* proc\.(?!blacklist|netlink|vmallocinfo)(?!.*:0000000)
  rcuperf: unknown
  avocado: interrupted warn

skip:
  '*': skip block not_installed job_skip
  dpdk-dts: skiped
  nvml: test_skip
  kselftests: test_skip unresolved unsupported
  perf-event-tests: perf_event_tests old_behavior use_caution unexplained new_behavior known_kernel_bug
  avocado: cancel
  xfstests: expunged
  ltp: unknown
  lkvs: na
