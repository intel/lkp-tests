suite: kselftests
testcase: kselftests
category: benchmark

kselftests:
  group:
    - mm
  test:
    - vmalloc-performance

---
# vmalloc stress test, nr_threads=1 and iterations=1 used 30-40s
# vmalloc stress test, nr_threads=4 and iterations=3 used 1700-1900s
nr_threads:
  - 1
  - 4
iterations:
  - 1
  - 3

kselftests:
  group:
    - mm
  test:
    - vmalloc-stress

---
kselftests:
  group:
    - dma

---
kselftests:
  group:
    - landlock
  test:
    - fs_bench

kernel_cmdline: lsm=landlock

---
kselftests:
  group:
    - filesystems
  test:
    - file_stressor

---
# resctrl's MBM/MBA/CAT/CMT cases measure real cache-occupancy and
# memory-bandwidth numbers (see the ResctrlStater in the kselftests
# parse script), not just pass/fail, so it belongs here rather than in
# kselftests.yaml's functional set. "make run_tests" for this group
# always runs the same fixed set of tests regardless of category, so
# keeping it in both files would just run the identical binary twice.
kselftests:
  group:
    - resctrl

kernel_cmdline: "rdt=cmt,mbmtotal,mbmlocal,l3cat,l3cdp,l2cat,l2cdp,mba,smba,bmec"
