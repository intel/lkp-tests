suite: lkvs
testcase: lkvs
category: functional
kernel_cmdline: "initcall_debug text log_buf_len=200M no_console_suspend ignore_loglevel intel_iommu=on,sm_on fred=on"

build-perf:

lkvs:
  test:
    - avx512vbmi
    - cet
    # modprobe dmatest hangs forever on kernels with 2a93f5747d0e
    # ("dmaengine: idxd: Flush all pending descriptors"), v7.0-rc6 and later
    # - dma
    - dsa
    - edac
    - fred
    - hotplug
    # - instruction-check
    - isst
    - pcie
    - pmu
    - pstate
    - pt
    - ras
    # - tdx-compliance
    # - tdx-osv-sanity
    - telemetry
    - th
    - thermal
    - umip
    - xsave

---
need_cpuid: 106

lkvs:
  test:
    - ifs
    - splitlock

---
need_cpu_model: Sapphire_Rapids,Emerald_Rapids,Granite_Rapids

lkvs:
  test:
    - sdsi # models in BM/sdsi/sdsi_fms_list: SPR, EMR, GNR_X, GNR_D

---
need_cpuid: 173

lkvs:
  test:
    - amx
    - tpm
    - tpmi

---
need_cpuid: 173

# Every ufs case loops over all uncore dies, so the stress and elc cases are
# split into their own jobs to keep each one well inside the job time budget.
lkvs:
  test: ufs
  group:
    - basic
    # check_ufs_elc_low_threshold idles about 105s per die, 28 minutes on a
    # host with 16 uncore dies
    # - elc-low-threshold
    - stress

---
need_cpuid: 175

lkvs:
  test:
    - cmpccxadd
