# Force software rendering for the modesetting driver's own compositing.
# Headless test rigs boot a real GPU with no monitor attached; the
# driver's default glamor (GL-based) acceleration path segfaults trying
# to initialize an EGL context with no active display connector. This
# has no effect on what unixbench-2d actually measures: it drives plain
# Xlib 2D drawing primitives, not GL, so disabling glamor only removes
# an unused acceleration layer, not the code path being benchmarked.
Section "Device"
	Identifier "Card0"
	Driver "modesetting"
	Option "AccelMethod" "none"
EndSection
